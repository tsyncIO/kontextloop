[project]
name = "kontextloop"
version = "0.1.0"
description = "Contextual German vocabulary learning terminal app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
vokabel = "kontextloop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
