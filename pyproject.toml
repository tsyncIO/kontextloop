[project]
name = "kontextloop"
version = "0.1.0"
description = "A context-driven synthesis engine and terminal runtime for accelerated immersive learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
vokabel = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
